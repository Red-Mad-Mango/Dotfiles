# h / l for fine seeking (backward / forward 5 seconds)
h seek -5
l seek 5

# Shift + h / Shift + l for larger skips (backward / forward 30 seconds)
H seek -30
L seek 30

# j / k for volume control (down / up)
j add volume -5
k add volume 5


# Playback Controls 

# Space to pause (standard mpv, but essential)
SPACE cycle pause

# g to go to the very beginning of the video (like 'gg' in Helix)
g seek 0 absolute-percent

# G to go to the end of the video
G seek 100 absolute-percent


# Window & Display 

# f for fullscreen (standard mpv)
f cycle fullscreen

# q to quit
q quit
